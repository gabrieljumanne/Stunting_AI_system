{% load static %}

<!-- Password Change Modal Backdrop -->
<div id="passwordChangeModal" class="fixed inset-0 z-50 hidden overflow-y-auto">
  <!-- Overlay -->
  <div class="fixed inset-0 bg-black bg-opacity-50 transition-opacity"></div>
  
  <!-- Modal Container -->
  <div class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-auto relative">
      <!-- Close Button -->
      <button id="closePasswordModal" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600">
        <i class="fas fa-times"></i>
      </button>
      
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b">
        <h3 class="text-lg font-semibold text-gray-700">Change Your Password</h3>
      </div>
      
      <!-- Modal Content -->
      <div class="px-6 py-4">
        <div id="passwordModalMessages" class="mb-4 hidden"></div>
        
        <form id="passwordChangeForm" method="post" action="{% url 'core:password_change' %}">
          {% csrf_token %}
          
          <!-- Current Password -->
          <div class="mb-4">
            <label for="id_old_password" class="block text-sm font-medium text-gray-700">Current Password</label>
            <input type="password" name="old_password" id="id_old_password" required autofocus
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                   placeholder="Enter your current password">
            <p class="error-message text-red-500 text-sm hidden" id="error_old_password"></p>
          </div>
          
          <!-- New Password -->
          <div class="mb-4">
            <label for="id_new_password1" class="block text-sm font-medium text-gray-700">New Password</label>
            <input type="password" name="new_password1" id="id_new_password1" required
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                   placeholder="Enter new password">
            <p class="error-message text-red-500 text-sm hidden" id="error_new_password1"></p>
            <p class="text-xs text-gray-500 mt-1">
              Your password must contain at least 8 characters and a number.
              It cannot contain your username or common words like 'stunting', 'health', 'child'.
            </p>
          </div>
          
          <!-- Confirm New Password -->
          <div class="mb-4">
            <label for="id_new_password2" class="block text-sm font-medium text-gray-700">Verify Password</label>
            <input type="password" name="new_password2" id="id_new_password2" required
                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                   placeholder="Confirm your new password">
            <p class="error-message text-red-500 text-sm hidden" id="error_new_password2"></p>
          </div>
          
          <!-- Action Buttons -->
          <div class="mt-6 flex justify-end space-x-3">
            <button type="button" id="cancelPasswordChange" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400">
              Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
              Change Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
