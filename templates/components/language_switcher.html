{% load i18n %}

<div class="language-switcher relative inline-block">
    <div class="dropdown">
        <button class="dropbtn flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200">
            <i class="fas fa-globe mr-2 text-blue-600"></i>
            {% get_current_language as LANGUAGE_CODE %}
            {% if LANGUAGE_CODE == 'sw' %}
                <span>Kiswahili</span>
            {% else %}
                <span>English</span>
            {% endif %}
            <i class="fas fa-chevron-down ml-2"></i>
        </button>
        
        <div class="dropdown-content absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 z-50 hidden">
            {% get_available_languages as LANGUAGES %}
            {% for lang_code, lang_name in LANGUAGES %}
                {% if lang_code != LANGUAGE_CODE %}
                    <form action="{% url 'set_language' %}" method="post" class="m-0">
                        {% csrf_token %}
                        <input name="language" type="hidden" value="{{ lang_code }}">
                        <input name="next" type="hidden" value="/dashbord/parent/">
                        <button type="submit" class="block w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition-colors duration-200 flex items-center">
                            {% if lang_code == 'sw' %}
                                <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI5MDAiIGhlaWdodD0iNjAwIiBmaWxsPSIjMDBhZjUwIj4KPGRlZnM+CjxwYXRoIGlkPSJzIiBkPSJNMCwwUzEwMCwwIDEwMCw1MFMwLDUwIDB6Ii8+CjwvZGVmcz4KPHJlY3Qgd2lkdGg9IjkwMCIgaGVpZ2h0PSI2MDAiIGZpbGw9IiMwMGFmNTAiLz4KPHJlY3Qgd2lkdGg9IjkwMCIgaGVpZ2h0PSIyMDAiIGZpbGw9IiNmZmQzMDAiLz4KPHJlY3Qgd2lkdGg9IjkwMCIgaGVpZ2h0PSIyMDAiIHk9IjQwMCIgZmlsbD0iIzAwMCIvPgo8L3N2Zz4=" alt="Tanzania Flag" class="w-5 h-3 mr-2 rounded">
                                <span>Kiswahili</span>
                            {% else %}
                                <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjYwMCIgdmlld0JveD0iMCAwIDEyMDAgNjAwIj4KPGRlZnM+CjxjbGlwUGF0aCBpZD0idCI+CjxwYXRoIGQ9Ik0wLDBWMzAwSDE0NjBWNjAwSDEyMDBWMzAwSDEyMDBIMTIwMFYweiIvPgo8L2NsaXBQYXRoPgo8L2RlZnM+CjxyZWN0IHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjYwMCIgZmlsbD0iIzAwMjg2OCI+PC9yZWN0Pgo8L3N2Zz4=" alt="UK Flag" class="w-5 h-3 mr-2 rounded">
                                <span>English</span>
                            {% endif %}
                        </button>
                    </form>
                {% endif %}
            {% endfor %}
        </div>
    </div>
</div>

<style>
.language-switcher .dropdown:hover .dropdown-content {
    display: block;
}

.language-switcher .dropdown-content {
    animation: fadeIn 0.15s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const dropdown = document.querySelector('.language-switcher .dropdown');
    const dropdownBtn = dropdown.querySelector('.dropbtn');
    const dropdownContent = dropdown.querySelector('.dropdown-content');
    
    dropdownBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownContent.classList.toggle('hidden');
    });
    
    document.addEventListener('click', function(e) {
        if (!dropdown.contains(e.target)) {
            dropdownContent.classList.add('hidden');
        }
    });
});
</script>
